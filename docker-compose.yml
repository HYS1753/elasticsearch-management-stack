version: "3.9"

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: es-management-api
    ports:
      - "8000:8000"
    env_file:
      - ./.env.api
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_NAME: Elasticsearch Management Tool
        NEXT_PUBLIC_APP_VERSION: 1.0.0
    container_name: es-management-frontend
    environment:
      CLUSTER_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
