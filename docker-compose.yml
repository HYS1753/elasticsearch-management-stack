version: "3.9"

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: es-management-api
    ports:
      - "8000:8000"
    env_file:
      - ./.env.api
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: es-management-frontend
    ports:
      - "3000:3000"
    env_file:
      - ./.env.frontend
    depends_on:
      - api
    restart: unless-stopped
